[project]
name = "youtube-clone-backend"
version = "0.1.0"
description = "YouTube clone API: FastAPI + PostgreSQL + MinIO + Celery"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["venv", ".venv"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # bugbear
  "UP",       # pyupgrade
  "S",        # bandit (security)
  "SIM",      # simplify
  "C4",       # comprehensions
  "PT",       # pytest style
  "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"alembic/versions/**" = ["E501"]
"app/cli/seed.py" = ["E501"]  # demo-data table: one video per line

[tool.ruff.lint.isort]
known-first-party = ["app"]
# backend/alembic/ (migrations dir) would otherwise make ruff treat `alembic` as first-party.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --tb=short: long tracebacks can print connection info (incl. DB password) on failures.
addopts = "-ra --strict-markers --tb=short"
