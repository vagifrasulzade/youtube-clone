# Variable => resolved per request via the http-level resolver (survives api restarts).
set $api_backend http://api:8000;
proxy_pass $api_backend;
proxy_http_version 1.1;
proxy_set_header Connection "";
# $http_host keeps the port, so the API's Origin check matches on non-80 ports too.
proxy_set_header Host $http_host;
# OVERWRITE, never append: the API trusts this header from nginx only, and a
# client-supplied value must not be able to choose the rate-limit key (review M2).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id;
proxy_read_timeout 120s;
