name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: youtube
          POSTGRES_PASSWORD: youtube
          POSTGRES_DB: youtube
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U youtube"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://youtube:youtube@localhost:5432/youtube
      REDIS_URL: redis://localhost:6379/0
      LOG_JSON: "false"
      # CI-only throwaway credentials for the ephemeral MinIO below.
      S3_ENDPOINT_URL: http://127.0.0.1:9000
      S3_ACCESS_KEY: youtube-app
      S3_SECRET_KEY: ci-only-app-secret-0000
    steps:
      - uses: actions/checkout@v4
      # MinIO cannot be a `services:` container (it needs `server /data` as its command),
      # so start it here and provision it with the same script deploys use.
      - name: Start MinIO and provision buckets + app user
        working-directory: .
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: ci-only-root-secret-0000
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER -e MINIO_ROOT_PASSWORD \
            cgr.dev/chainguard/minio@sha256:0f9fda72fbc6bd3560ea903aec2ceefa20f6ba82628d67656f37fb370c39ae9c \
            server /data
          docker run --rm --network host \
            -e MINIO_URL=http://127.0.0.1:9000 -e MINIO_ROOT_USER -e MINIO_ROOT_PASSWORD \
            -e MINIO_APP_ACCESS_KEY="$S3_ACCESS_KEY" -e MINIO_APP_SECRET_KEY="$S3_SECRET_KEY" \
            -v "$PWD/infra/minio:/init:ro" --entrypoint /bin/sh \
            cgr.dev/chainguard/minio-client@sha256:e1f3f37e8b13f34be49494f441ca01ff7be4e05d7cf04bf26681b0fe380852e1 \
            /init/init.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
